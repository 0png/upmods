name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        shell: bash
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm release:check
      - run: pnpm pack:cli
      - name: Smoke-test release tarball
        shell: bash
        run: |
          npm install --global ./release/upmods-*.tgz
          test "$(upmods --version)" = "${GITHUB_REF_NAME#v}"
          upmods --help
      - name: Publish to npm when NPM_TOKEN is configured
        if: env.NODE_AUTH_TOKEN != ''
        run: pnpm --dir packages/cli publish --access public --no-git-checks
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag
